services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-CU27-GDR1-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: creates NewsletterTest if missing and runs the repo SQL script with the classic ODBC sqlcmd.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-CU27-GDR1-ubuntu-22.04
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./db:/db:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C -b
        -Q "IF DB_ID('NewsletterTest') IS NULL CREATE DATABASE NewsletterTest"
        && /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C -b
        -d NewsletterTest -i /db/NewsletterSubscription.sql
    restart: "no"

  web:
    build: .
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Newsletter: "Server=db;Database=NewsletterTest;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=true;Connect Timeout=5"
      Newsletter__BaseUrl: "http://localhost:5080"
    ports:
      - "5080:8080"
